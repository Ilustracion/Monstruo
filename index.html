<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi ilustración en realidad aumentada</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
    #start {position:fixed;z-index:20;inset:0;background:#111e;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px}
    button {border:0;border-radius:999px;background:#fff;color:#111;padding:14px 24px;font-size:17px;font-weight:700;cursor:pointer}
    #hint {position:fixed;z-index:10;bottom:24px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px black;pointer-events:none}
  </style>
</head>
<body>
  <div id="start"><h1>Ilustración en movimiento</h1><p>Permite el acceso a la cámara y apunta a la ilustración impresa.</p><button id="go">Iniciar experiencia</button><p id="error" role="alert"></p></div>
  <div id="hint">Apunta la cámara hacia la ilustración</div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets><video id="video" src="./animacion.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video src="#video" position="0 0 0" width="1" height="0.5625"></a-video>
    </a-entity>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    const target = document.getElementById('target');
    const video = document.getElementById('video');
    const start = document.getElementById('start');
    const error = document.getElementById('error');
    const hint = document.getElementById('hint');
    document.getElementById('go').addEventListener('click', async () => {
      try {
        // Desbloquea reproducción de vídeo en móviles desde un gesto del usuario.
        video.muted = true;
        await video.play();
        video.pause(); video.currentTime = 0;
        await scene.systems['mindar-image-system'].start();
        start.style.display = 'none';
      } catch (e) {
        error.textContent = 'No se pudo iniciar. Comprueba los permisos de cámara, HTTPS y los archivos. ' + (e.message || '');
      }
    });
    target.addEventListener('targetFound', async () => {
      hint.textContent = '¡Ilustración detectada!';
      try { await video.play(); } catch (e) { hint.textContent = 'Toca la pantalla para reproducir'; }
    });
    target.addEventListener('targetLost', () => { video.pause(); hint.textContent = 'Apunta la cámara hacia la ilustración'; });
    document.body.addEventListener('click', () => { if (start.style.display === 'none' && video.paused) video.play().catch(()=>{}); });
  </script>
</body>
</html>
